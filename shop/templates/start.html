{% extends "base.html" %}
{% block content %}
<section class="hero">
  <h1>Everything for a better desk</h1>
  <p>Mice, keyboards, lamps, bags and more for work and study.</p>
</section>
<section class="categories">
  <h2>Shop by category</h2>
  <ul class="category-grid">
    {% for name, url, image in category_tiles %}
    <li>
      <a class="category-tile" href="{{ url }}">
        <img src="{{ image }}" alt="" width="160" height="120">
        <span>{{ name }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
