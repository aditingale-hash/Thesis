[project]
name = "slm-web-interaction-prototype"
version = "0.1.0"
description = "Research prototype: DOM vs. visual vs. tool-based web interaction for small language model agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.159.1",
    "starlette==1.9.0",
    "jinja2==3.1.6",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.32",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "playwright==1.56.0",
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["shop", "agent", "pipelines", "evaluation", "evaluation.analysis", "evaluation.labelling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
